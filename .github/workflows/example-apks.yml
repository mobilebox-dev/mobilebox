# Bring your build (Musti7even/phonebox, docs/BUILDS.md): the example APKs the docs install, built from a blank Expo app on
# GitHub Actions and attached to the release `example-apks`: a release APK (arm64-v8a, what Mobilebox phones run) and an
# Expo dev-client debug APK that loads its JavaScript from Metro.
name: example-apks
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk; mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/clt.zip
          unzip -q /tmp/clt.zip -d $ANDROID_HOME/cmdline-tools && mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV; echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
      - name: Release APK
        run: |
          cd $RUNNER_TEMP && npx --yes create-expo-app@latest example --template blank
          cd example && sed -i 's/Open up App.js to start working on your app!/Mobilebox: bring your build/' App.js
          npx expo prebuild -p android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/mobilebox-example-release.apk
      - name: Dev-client APK
        run: |
          cd $RUNNER_TEMP && npx --yes create-expo-app@latest devclient --template blank
          cd devclient && npx expo install expo-dev-client
          node -e 'const f="app.json",j=require("./"+f);j.expo.scheme="mobileboxexample";j.expo.android={...(j.expo.android||{}),package:"dev.mobilebox.example.devclient"};require("fs").writeFileSync(f,JSON.stringify(j,null,2))'
          npx expo prebuild -p android --no-install
          cd android && ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/mobilebox-example-devclient.apk
      - name: Release assets
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la *.apk
          gh release view example-apks >/dev/null 2>&1 || gh release create example-apks --target research/builds --title "Example APKs for Bring your build" --notes "Built by .github/workflows/example-apks.yml from a blank Expo app; used by Mobilebox's docs (/docs/builds)." --prerelease
          gh release upload example-apks mobilebox-example-release.apk mobilebox-example-devclient.apk --clobber
