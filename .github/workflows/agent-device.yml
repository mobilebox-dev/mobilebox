name: agent-device plugin
on:
  push:
    branches: [main]
    paths: ['packages/agent-device/**', '.github/workflows/agent-device.yml']
  pull_request:
    paths: ['packages/agent-device/**', '.github/workflows/agent-device.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Clones agent-device at AGENT_DEVICE_VERSION, tests, type-checks, builds, runs Callstack's package check, packs.
      - run: packages/agent-device/scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mobilebox-agent-device
          path: packages/agent-device/mobilebox-agent-device-*.tgz
